name: XFIT Drinkware Daily Live Refresh
on:
  schedule:
    - cron: '31 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xfit-drinkware-daily-live.yml'
      - 'scripts/xfit_drinkware_refresh.py'
      - 'tests/test_drinkware_refresh.py'
      - 'content/revisions/drinkware-buying-guide.html'
permissions:
  contents: read
  actions: read
concurrency:
  group: xfit-wp-heavy-reads
  cancel-in-progress: false
jobs:
  refresh:
    if: ${{ vars.XFIT_AFFIL_FEED_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL || 'https://xfit.cz' }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      XFIT_NAMAXIMUM_FEED_URL: ${{ secrets.XFIT_NAMAXIMUM_FEED_URL || secrets.XFIT_GREENMEDICAL_FEED_URL }}
      XFIT_AFFIL_DEFAULT_LINK: ${{ secrets.XFIT_AFFIL_DEFAULT_LINK }}
      XFIT_AFFIL_SAMPLE_PRODUCT_LINK: ${{ secrets.XFIT_AFFIL_SAMPLE_PRODUCT_LINK }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source and release regression tests
        run: python -m unittest discover -s tests -v
      - name: Fetch fresh authenticated drinkware catalog
        run: python scripts/xfit_feed_ingest.py
      - name: Validate campaign sample without clicks
        run: python scripts/xfit_affil_deeplink.py
      - name: Prepare exact new commercial block
        run: python -m scripts.xfit_drinkware_comparison prepare
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify generated layout before any write
        run: node tests/drinkware_comparison_mobile.cjs preview
      - name: Capture current pinned post and planned generated block
        run: python -m scripts.xfit_drinkware_refresh snapshot
      - name: Immutable prewrite rollback backup
        uses: actions/upload-artifact@v4
        with:
          name: drinkware-original-before-refresh
          path: reports/backups/xfit-drinkware-before-refresh.json
          retention-days: 7
          if-no-files-found: error
      - name: Refresh only generated sections and verify live
        run: python -m scripts.xfit_drinkware_refresh apply
      - name: Verify live card hrefs and mobile layout
        run: |
          node tests/drinkware_comparison_mobile.cjs live
          node - <<'JS'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{const browser=await chromium.launch({headless:true});try{
            const page=await browser.newPage({viewport:{width:375,height:812}});
            await page.goto('https://xfit.cz/xfit-os-sejkry-a-sportovni-lahve/',{waitUntil:'domcontentloaded',timeout:45000});
            const guide=page.locator('#xfit-drinkware-buying-guide-v1');
            assert.equal(await guide.count(),1);
            assert.ok(await guide.locator('h2').count()>=5);
            assert.ok((await guide.innerText()).split(/\s+/).length>=650);
            assert.equal(await guide.evaluate(el=>el.scrollWidth>el.clientWidth+2),false);
            console.log('DRINKWARE_EDITORIAL_MOBILE_LIVE_VERIFIED');
          }finally{await browser.close()}})().catch(()=>process.exitCode=2);
          JS
      - name: Preserve mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drinkware-refresh-mobile
          path: reports/browser-qa/drinkware-*.png
          retention-days: 7
          if-no-files-found: ignore

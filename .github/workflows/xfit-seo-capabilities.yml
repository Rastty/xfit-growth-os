name: XFIT SEO Metadata Capability Inspect
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/xfit-seo-capabilities.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL || 'https://xfit.cz' }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only SEO plugin and meta endpoint introspection
        run: python -m scripts.xfit_seo_capabilities

name: XFIT Mobile Content QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xfit-mobile-qa.yml'
  schedule:
    - cron: '11 8 * * 2,5'
permissions:
  contents: read
jobs:
  mobile-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Chromium for real mobile rendering
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run mobile browser verification on live pages
        run: node tests/live_page_qa.cjs
      - name: Keep visual screenshots for QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xfit-mobile-qa-screenshots
          path: reports/browser-qa/*.png
          retention-days: 7
          if-no-files-found: ignore

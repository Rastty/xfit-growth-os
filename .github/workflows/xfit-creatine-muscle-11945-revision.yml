name: XFIT Creatine 11945 Evidence-led Article Revision
# One-time, exact existing article. Does not create, unpublish or redirect.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xfit-creatine-muscle-11945-revision.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xfit-wp-heavy-reads
  cancel-in-progress: false
jobs:
  revise-one:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL || 'https://xfit.cz' }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate code and medical editorial revision
        run: python -m unittest discover -s tests -v
      - name: Snapshot exact malformed legacy post before writing
        run: python -m scripts.xfit_creatine_muscle_revision_11945 snapshot
      - name: Mandatory immutable full-body 90-day rollback artifact
        uses: actions/upload-artifact@v4
        with:
          name: xfit-creatine-11945-original-${{ github.run_id }}
          path: reports/backups/xfit-creatine-11945-before-revision.json
          retention-days: 90
          if-no-files-found: error
      - name: Single WP content revision with raw and public verification
        shell: bash
        run: |
          set -o pipefail
          python -m scripts.xfit_creatine_muscle_revision_11945 deploy | tee -a "$GITHUB_STEP_SUMMARY"

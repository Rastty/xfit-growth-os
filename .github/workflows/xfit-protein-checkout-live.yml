name: XFIT Protein Checkout-cost Onepost Live Release
# One-only reviewed text replacement in WP 25451; never a bulk republication.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xfit-protein-checkout-live.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xfit-wp-heavy-reads
  cancel-in-progress: false
jobs:
  publish-reviewed-checkout-copy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL || 'https://xfit.cz' }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit test the full site plus onepost source, rollback and public proof
        run: |
          python -m unittest discover -s tests -v
          python -m unittest tests.test_editor_protein_checkout_cost tests.test_protein_checkout_release -v
      - name: Read current WordPress source and create immutable prewrite artifact
        run: python -m scripts.xfit_protein_checkout_release snapshot
      - name: Upload original complete WordPress HTML before any write
        uses: actions/upload-artifact@v4
        with:
          name: xfit-protein-checkout-25451-rollback-${{ github.run_id }}
          path: reports/backups/xfit-protein-checkout-25451.json
          retention-days: 90
          if-no-files-found: error
      - name: One approved paragraph replacement with WP and public readback
        shell: bash
        run: |
          set -o pipefail
          python -m scripts.xfit_protein_checkout_release apply | tee -a "$GITHUB_STEP_SUMMARY"

name: XFIT Creatine Beginners 7468 Editorial Safety Revision
# Exact-post reattempt after preflight found three old 5NM2022 coupon mentions.
# Source and coupon counts must match before backup and the only content POST.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xfit-creatine-beginners-7468-live.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Confirm exact legacy WordPress post 7468 content revision'
        type: choice
        required: true
        options: [REVISE_7468]
permissions:
  contents: read
concurrency:
  group: xfit-wp-heavy-reads
  cancel-in-progress: false
jobs:
  revise-one:
    if: github.event_name == 'push' || inputs.confirm == 'REVISE_7468'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL || 'https://xfit.cz' }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Full quality and single-post safety regression suite
        run: python -m unittest discover -s tests -q
      - name: Verify old contradictory advice and snapshot full raw WordPress body
        run: python -m scripts.xfit_creatine_beginners_7468 snapshot
      - name: Mandatory immutable 90-day rollback backup before write
        uses: actions/upload-artifact@v4
        with:
          name: xfit-creatine-beginners-7468-original-${{ github.run_id }}
          path: reports/backups/xfit-creatine-beginners-7468-original.json
          retention-days: 90
          if-no-files-found: error
      - name: One content-only WordPress POST with authenticated and public readback
        shell: bash
        run: |
          set -o pipefail
          python -m scripts.xfit_creatine_beginners_7468 deploy | tee -a "$GITHUB_STEP_SUMMARY"

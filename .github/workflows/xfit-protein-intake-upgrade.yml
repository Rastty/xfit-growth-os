name: XFIT Protein Intake Editorial Upgrade
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xfit-protein-intake-upgrade.yml'
permissions:
  contents: read
concurrency:
  group: xfit-editor-protein-13717
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL || 'https://xfit.cz' }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce Xfit regression and editorial checks
        run: python -m unittest discover -s tests -v
      - name: Compare checked original content SHA, backup before writing
        run: python -m scripts.xfit_protein_intake_upgrade snapshot
      - name: Immutable original article backup before any write
        uses: actions/upload-artifact@v4
        with:
          name: xfit-protein-intake-13717-original-${{ github.run_id }}
          path: reports/backups/xfit-protein-intake-13717-original.json
          retention-days: 90
          if-no-files-found: error
      - name: Update original WP article and verify public page or roll back
        run: python -m scripts.xfit_protein_intake_upgrade deploy

name: XFIT Nut Butter Snacks Commerce Onepost
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xfit-nut-butter-snacks-handoff.yml'
permissions:
  contents: read
concurrency:
  group: xfit-wp-heavy-reads
  cancel-in-progress: false
jobs:
  onepost:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL || 'https://xfit.cz' }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect blocked sugar article source in the same runner (GET only)
        continue-on-error: true
        run: |
          python - <<'PY'
          import json,re
          from urllib.parse import urlencode,urlsplit
          from scripts.xfit_sugar_label_revision import SLUG,URL,TITLE,FIELDS,read,reviewed,expected
          from scripts.wp_publish import wp_request,normalized_base,article_visible,normalize_visible,editorial_links,PublishError
          rows=wp_request(normalized_base(),"posts?"+urlencode({"slug":SLUG,"context":"edit","status":"publish","per_page":2,"_fields":FIELDS}))
          out={"state":"SUGAR_LABEL_SOURCE_REVIEW","rows":len(rows) if isinstance(rows,list) else None,"wordpress_writes":0}
          if isinstance(rows,list) and len(rows)==1:
              row=rows[0]
              raw=(row.get("content") or {}).get("raw","")
              text,_=article_visible(raw)
              anchors=("Vanilkový jogurt","Mandlové mléko","Ořechová másla","Rajčatová omáčka","Cukr pod jinými názvy","Je již notoricky známé","13 procent","2015")
              out.update(post_id=row.get("id"),modified_gmt=row.get("modified_gmt"),title_matches=normalize_visible((row.get("title") or {}).get("raw",""))==normalize_visible(TITLE),canonical=row.get("link")==URL,missing_anchors=[a for a in anchors if normalize_visible(a) not in text],media=bool(re.search(r"<\s*(?:img|iframe|video|audio|figure|script|form)\b",raw,re.I)),link_count=len(editorial_links(raw)),link_hosts=sorted(set(urlsplit(h).hostname or "relative" for h in editorial_links(raw))),raw_bytes=len(raw.encode()))
              try:
                  reviewed(read(),expected())
                  out["review"]="pass"
              except PublishError as exc:
                  # Only the constant application error vocabulary is allowed.
                  known={"Reviewed source identity drift","Source changed since reviewed older article","Publicly reviewed old content not matched","Original has unreviewed media or links","Public page still shows old/incomplete article body; cache or renderer stale","Expected one exact published source"}
                  out["review"]=str(exc) if str(exc) in known else "other_source_guard"
          print(json.dumps(out,ensure_ascii=False))
          PY
      - name: Validate full repository before onepost
        run: python -m unittest discover -s tests -v
      - name: Require exact live nut butter comparison before linking
        run: |
          python - <<'PY'
          from scripts.xfit_nut_butter_refresh import read_source, URL, TITLE
          from scripts.wp_publish import verify_public
          raw, _ = read_source()
          verify_public(URL, TITLE, raw)
          print("PUBLIC_NUT_BUTTER_COMPARISON_VERIFIED_BEFORE_SOURCE_WRITE")
          PY
      - name: Capture current exact educational source before any write
        run: python -m scripts.xfit_verified_inlink_release nut_butter_snacks_7195 snapshot
      - name: Preserve immutable original before possible POST
        uses: actions/upload-artifact@v4
        with:
          name: nut-butter-snacks-original
          path: reports/backups/xfit-reviewed-inlink-nut_butter_snacks_7195.json
          retention-days: 90
          if-no-files-found: error
      - name: One source-bound existing article update and public proof
        shell: bash
        run: |
          set -o pipefail
          python -m scripts.xfit_verified_inlink_release nut_butter_snacks_7195 apply | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify actual contextual link on mobile without opening merchant
        shell: bash
        run: |
          node - <<'JS'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try {
              const page=await browser.newPage({viewport:{width:375,height:812}});
              const target='https://xfit.cz/xfit-os-arasidova-a-orechova-masla/';
              await page.goto('https://xfit.cz/jaky-typ-proteinu-si-vybrat-pro-pripravu-proteinovych-snacku-a-napoju/',{waitUntil:'domcontentloaded',timeout:45000});
              const paragraph=page.locator('p[data-xfit-handoff="xfit-nut-butter-snacks-7195-20261127"]');
              assert.equal(await paragraph.count(),1);
              const a=paragraph.locator('a');
              assert.equal(await a.count(),1);
              assert.equal(await a.getAttribute('href'),target);
              assert.equal(await a.isVisible(),true);
              const prior=page.locator('p[data-xfit-handoff="xfit-drinkware-snacks-7195-20261127"]');
              assert.equal(await prior.count(),1);
              assert.equal(await paragraph.evaluate((el)=>el.nextElementSibling?.getAttribute('data-xfit-handoff')), 'xfit-drinkware-snacks-7195-20261127');
              await paragraph.scrollIntoViewIfNeeded();
              const box=await paragraph.boundingBox();
              assert.ok(box && box.x>=-1 && box.x+box.width<=376);
              fs.mkdirSync('reports/browser-qa',{recursive:true});
              await page.screenshot({path:'reports/browser-qa/nut-butter-snacks-handoff.png'});
              await page.goto(target,{waitUntil:'domcontentloaded',timeout:45000});
              assert.equal(page.url(),target);
              assert.ok(await page.locator('article.xfit-product-card').count()>=2);
              console.log(JSON.stringify({state:'NUT_BUTTER_HANDOFF_MOBILE_VERIFIED',width:375,target,post_id:7195}));
            } finally {await browser.close();}
          })().catch(()=>{console.error('NUT_BUTTER_HANDOFF_MOBILE_QA_FAILED');process.exitCode=2;});
          JS
      - name: Preserve screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nut-butter-snacks-mobile
          path: reports/browser-qa/nut-butter-snacks-handoff.png
          retention-days: 7
          if-no-files-found: ignore

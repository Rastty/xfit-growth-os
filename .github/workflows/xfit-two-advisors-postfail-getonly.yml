name: XFIT Two Adviser Category Post-failure GET Only
# Prior 44897339584 exited after backup; never retry a possibly committed POST.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xfit-two-advisors-postfail-getonly.yml'
permissions:
  contents: read
concurrency:
  group: xfit-two-advisors-postfail-getonly-20261121
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL || 'https://xfit.cz' }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression tests for verified, partial and uncertain outcomes
        run: python -m unittest tests.test_two_advisors_postfail_getonly -v
      - name: Authenticated WP and public page GET-only reconciliation
        run: python -m scripts.xfit_two_advisors_category_postfail_getonly
      - name: Preserve redacted result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xfit-two-advisors-postfail-getonly-${{ github.run_id }}
          path: reports/xfit-two-advisors-postfail-getonly.json
          if-no-files-found: warn
          retention-days: 14

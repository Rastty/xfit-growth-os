name: XFIT Consent-Gated Analytics Plugin Package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xfit-analytics-plugin-package.yml'
      - 'assets/analytics/xfit-webtoffee-bridge.js'
      - 'assets/analytics/xfit-outbound.js'
      - 'wordpress-plugin/xfit-analytics/xfit-analytics.php'
      - 'scripts/build_xfit_wp_plugin.py'
      - 'tests/test_wp_analytics_plugin.py'
      - 'tests/test_webtoffee_bridge.cjs'
      - 'tests/test_outbound_analytics.cjs'
      - 'tests/test_analytics_bridge_integration.cjs'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify offline plugin package and source integrity
        run: python -m unittest tests/test_wp_analytics_plugin.py -v
      - name: Verify consent revocation, denied state and outbound event privacy
        run: |
          node --check assets/analytics/xfit-outbound.js
          node --check assets/analytics/xfit-webtoffee-bridge.js
          node --test tests/test_webtoffee_bridge.cjs tests/test_outbound_analytics.cjs tests/test_analytics_bridge_integration.cjs
      - name: Build installable plugin ZIP from reviewed main source
        run: python -m scripts.build_xfit_wp_plugin --output dist/xfit-analytics-0.1.2.zip
      - name: Produce verifiable install package checksum
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          test -s xfit-analytics-0.1.2.zip
          sha256sum xfit-analytics-0.1.2.zip > xfit-analytics-0.1.2.zip.sha256
          sha256sum --check xfit-analytics-0.1.2.zip.sha256
          {
            echo "### XFIT WordPress analytics installation package"
            echo "Installable ZIP and SHA-256 checksum are attached as the workflow artifact."
            echo "This build does not install or activate a WordPress plugin."
            echo "No real GA4 click, Affial order or commission is established by packaging."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve exact installable package and checksum
        uses: actions/upload-artifact@v4
        with:
          name: xfit-consent-analytics-wp-plugin-${{ github.run_id }}
          path: |
            dist/xfit-analytics-0.1.2.zip
            dist/xfit-analytics-0.1.2.zip.sha256
          retention-days: 30
          if-no-files-found: error

name: XFIT Read-only Canonical Preflight
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xfit-readonly-canonical-preflight.yml'
  workflow_dispatch:
    inputs:
      post_id:
        description: 'Reviewed in-body canonical conflict post (GET only)'
        type: choice
        required: true
        default: '9371'
        options:
          - '9371'
          - '9462'
          - '8713'
          - '9008'
          - '9544'
          - '6959'
          - '7268'
          - '8531'
          - '9923'
          - '7305'
          - '9765'
          - '5804'
          - '6558'
permissions:
  contents: read
  issues: write # Only for the sanitized read-only evidence comment in issue #282
concurrency:
  group: xfit-wp-heavy-reads
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      XFIT_PREFLIGHT_POST_ID: ${{ inputs.post_id || '9371' }}
      WP_BASE_URL: ${{ secrets.WP_BASE_URL || 'https://xfit.cz' }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source fingerprinting regression tests
        run: python -m unittest discover -s tests -p 'test_xfit_canonical_preflight.py' -v
      - name: Authenticated and independent public GET checks — no POST
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          python -m scripts.xfit_canonical_preflight | tee reports/xfit-canonical-preflight.json
      - name: Record sanitized proof in existing canonical triage issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### XFIT canonical preflight (GET-only)'
            echo
            echo "Post ID: $XFIT_PREFLIGHT_POST_ID"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo 'WordPress write attempts: **0**'
            echo
            echo '```json'
            if test -s reports/xfit-canonical-preflight.json; then
              cat reports/xfit-canonical-preflight.json
            else
              echo '{"state":"PREFLIGHT_NO_REPORT","remote_post_attempts":0}'
            fi
            echo '```'
          } > /tmp/xfit-canonical-preflight-comment.md
          gh issue comment 282 --repo "$GITHUB_REPOSITORY" --body-file /tmp/xfit-canonical-preflight-comment.md

name: XFIT Japanese Exercise 9462 Onepost Release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xfit-japanese-exercise-9462-live.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xfit-wp-heavy-reads
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL || 'https://xfit.cz' }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Full regression and source-specific safety tests
        run: |
          python -m unittest discover -s tests -q
          python -m unittest tests.test_japanese_exercise_9462 -v
      - name: Snapshot exact reviewed authenticated and public article
        run: python -m scripts.xfit_japanese_exercise_9462 snapshot
      - name: Upload immutable original before any WordPress POST
        uses: actions/upload-artifact@v4
        with:
          name: xfit-japanese-exercise-9462-rollback-${{ github.run_id }}
          path: reports/backups/xfit-japanese-exercise-9462-original.json
          if-no-files-found: error
          retention-days: 90
      - name: Guarded single content POST and independent public verification
        shell: bash
        run: |
          set -o pipefail
          python -m scripts.xfit_japanese_exercise_9462 apply | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Public canonical and mobile decision proof at 320/375/768
        run: node tests/japanese_exercise_9462_live_qa.cjs
      - name: Retain public mobile screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xfit-japanese-exercise-9462-mobile-${{ github.run_id }}
          path: reports/browser-qa/japanese-exercise-9462-375.png
          if-no-files-found: ignore
          retention-days: 14

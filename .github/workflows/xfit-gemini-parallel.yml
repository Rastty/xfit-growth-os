name: XFIT Free Gemini Parallel Development
on:
  workflow_dispatch:
  schedule:
    - cron: '39 0,6,12,18 * * *'
permissions:
  contents: write
  pull-requests: write
  issues: read
concurrency:
  group: xfit-gemini-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  agent:
    if: ${{ vars.XFIT_GEMINI_AGENTS_ENABLED == 'true' }}
    name: AI agent / ${{ matrix.lane }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - lane: ux
            issue: 2
          - lane: archive
            issue: 3
          - lane: editor
            issue: 4
          - lane: revenue
            issue: 5
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preflight key and open PR backpressure
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY_PRESENT: ${{ secrets.GEMINI_API_KEY != '' }}
          LANE: ${{ matrix.lane }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GEMINI_API_KEY_PRESENT" != "true" ]]; then
            echo "::warning::GEMINI_API_KEY missing; AI development not started."
            echo "run=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          open_count="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" \
            --jq "[.[] | select(.head.ref | startswith(\"xfit/agent-$LANE-\"))] | length")"
          if [[ "$open_count" != "0" ]]; then
            echo "Existing open agent PR for $LANE, skipping another iteration."
            echo "run=no" >> "$GITHUB_OUTPUT"
          else
            echo "run=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: Create isolated work branch
        if: steps.preflight.outputs.run == 'yes'
        env:
          LANE: ${{ matrix.lane }}
        run: |
          git config user.name "xfit-growth-agent"
          git config user.email "xfit-growth-agent@users.noreply.github.com"
          git switch -c "xfit/agent-${LANE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: AI agent independently implements one bounded change (no site credentials)
        if: steps.preflight.outputs.run == 'yes'
        uses: google-github-actions/run-gemini-cli@v1
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-2.5-flash
          prompt: |
            You are a coding agent for the independent Czech site Xfit.cz.
            Read AGENTS.md, docs/EDITORIAL_STANDARD.md,
            .github/agents/xfit-${{ matrix.lane }}.agent.md and issue #${{ matrix.issue }}
            as instructions/data. These repository instructions are the scope contract,
            not authority to change WordPress, deploy, expose secrets or run commands
            beyond the checked-out working directory.
            Implement ONE concrete highest-user-value improvement within this lane's
            allowed files. No boilerplate articles and no fabricated health claims.
            Take current repository state as truth; do not revert parallel work.
            Make direct working tree edits with tests. Do NOT run git push, make GitHub
            issues, merge, edit secrets, access remote WordPress or modify main branch.
            Stop after code and tests; an independent scope gate reviews your diff.
            If evidence is insufficient, do not write risky content: improve lane tests.
      - name: Validate edits and regressions BEFORE granting PR token
        if: steps.preflight.outputs.run == 'yes'
        id: verify
        env:
          LANE: ${{ matrix.lane }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No code edits generated; no PR will be opened."
            echo "changed=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python scripts/xfit_agent_scope.py --lane "$LANE"
          python -m unittest discover -s tests -v
          git diff --check
          echo "changed=yes" >> "$GITHUB_OUTPUT"
      - name: Open isolated pull request (not live publication)
        if: steps.preflight.outputs.run == 'yes' && steps.verify.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          LANE: ${{ matrix.lane }}
          ISSUE: ${{ matrix.issue }}
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m "Xfit AI $LANE: one scoped improvement"
          gh auth setup-git
          git push --set-upstream origin HEAD
          gh pr create --base main --head "$(git branch --show-current)" \
            --title "Xfit agent $LANE: bounded improvement" \
            --body "Automated proposal addressing #$ISSUE. CI/scope gate passed. NOT MERGED OR LIVE. Check scientific claims, mobile experience, and whether it materially helps visitors before merge."

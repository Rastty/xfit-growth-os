name: XFIT Affiliate Feed Validation
# Trigger initial post-setup read-only catalog check; no WordPress writes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xfit-feed-validation.yml'
      - 'scripts/xfit_feed_ingest.py'
  schedule:
    - cron: '23 4 * * *'
permissions:
  contents: read
jobs:
  check-feed:
    concurrency:
      group: xfit-feed-refresh
      cancel-in-progress: false
    if: ${{ vars.XFIT_AFFIL_FEED_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      XFIT_NAMAXIMUM_FEED_URL: ${{ secrets.XFIT_NAMAXIMUM_FEED_URL || secrets.XFIT_GREENMEDICAL_FEED_URL }}
      XFIT_AFFIL_DEFAULT_LINK: ${{ secrets.XFIT_AFFIL_DEFAULT_LINK }}
      XFIT_AFFIL_SAMPLE_PRODUCT_LINK: ${{ secrets.XFIT_AFFIL_SAMPLE_PRODUCT_LINK }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Read-only feed reconnaissance
        run: python scripts/xfit_feed_ingest.py
      - name: Validate optional Affial sample deeplink structure (no clicks)
        run: python scripts/xfit_affil_deeplink.py
      - name: Evaluate creatine and protein selection candidates (read-only)
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.xfit_select import select_offers
          data = json.loads(Path("reports/private-greenmedical-catalog.json").read_text(encoding="utf-8"))
          for kind in ("creatine", "whey", "plant_protein"):
              ranked = select_offers(data, kind, max_price=1500)
              print(json.dumps({"kind": kind, "candidates_under_1500_czk": len(ranked),
                  "affiliate_deeplinks_verified": False, "public_site_modified": False},
                  ensure_ascii=False))
          PY
      - name: Preserve private validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: xfit-namaximum-feed-summary
          path: reports/affiliate-feed-summary.json
          retention-days: 7
          if-no-files-found: error

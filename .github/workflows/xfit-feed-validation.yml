name: XFIT Affiliate Feed Validation
# Trigger initial post-setup read-only catalog check; no WordPress writes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xfit-feed-validation.yml'
      - 'scripts/xfit_feed_ingest.py'
      - 'scripts/xfit_multishop_readiness.py'
      - 'tests/test_multishop_readiness.py'
  schedule:
    - cron: '23 4 * * *'
permissions:
  contents: read
jobs:
  check-feed:
    concurrency:
      group: xfit-feed-refresh
      cancel-in-progress: false
    if: ${{ vars.XFIT_AFFIL_FEED_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      XFIT_NAMAXIMUM_FEED_URL: ${{ secrets.XFIT_NAMAXIMUM_FEED_URL || secrets.XFIT_GREENMEDICAL_FEED_URL }}
      XFIT_AFFIL_DEFAULT_LINK: ${{ secrets.XFIT_AFFIL_DEFAULT_LINK }}
      XFIT_AFFIL_SAMPLE_PRODUCT_LINK: ${{ secrets.XFIT_AFFIL_SAMPLE_PRODUCT_LINK }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Read-only feed reconnaissance
        run: python scripts/xfit_feed_ingest.py
      - name: Validate optional Affial sample deeplink structure (no clicks)
        run: python scripts/xfit_affil_deeplink.py
      - name: Evaluate creatine and protein selection candidates (read-only)
        shell: bash
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          from scripts.xfit_select import select_offers
          data = json.loads(Path("reports/private-greenmedical-catalog.json").read_text(encoding="utf-8"))
          for kind in ("creatine", "whey", "plant_protein"):
              ranked = select_offers(data, kind, max_price=1500)
              # Selection records retain interpreted dispatch state, not raw
              # DELIVERY_DATE/AVAILABILITY fields. Field-presence coverage is
              # computed only on original source rows in the redacted artifact.
              dispatch_states = Counter(offer["availability_state"] for offer in ranked)
              print(json.dumps({"kind": kind, "candidates_under_1500_czk": len(ranked),
                  "selected_xml_dispatch_states": dict(sorted(dispatch_states.items())),
                  "actual_stock_verified": False,
                  "affiliate_deeplinks_verified": False, "public_site_modified": False},
                  ensure_ascii=False))
          PY
      - name: Screen actual feed identity fields for existing Core multishop contract
        run: python -m scripts.xfit_multishop_readiness
      - name: Screen remaining catalog groups for new practical purchase intent
        run: |
          python - <<'PY'
          import json,re
          from collections import Counter,defaultdict
          from pathlib import Path
          from urllib.parse import urlsplit
          from scripts.xfit_select import folded
          from scripts.xfit_availability import delivery_state
          from scripts.xfit_feed_ingest import catalog_identity_matches_url
          from scripts.xfit_equipment_comparison import equipment_kind
          data=json.loads(Path("reports/private-greenmedical-catalog.json").read_text(encoding="utf-8"))
          patterns={
            "shaker":r"\b(shaker\w*|sejkr\w*|sejker\w*)\b",
            "bottle":r"\b(lahv\w*|lahev|flasa|flas\w*|bottle\w*|bidon\w*)\b",
            "training_accessories":r"\b(rukavic\w*|gloves|trhac\w*|straps|svihadl\w*|jump rope|foam roller|masazni valec|masazny valec|cink\w*|dumbbell\w*)\b",
            "food_scale":r"\b(kuchynsk\w* vah\w*|digitaln\w* vah\w*|kitchen scale)\b",
            "oats":r"\b(ovesn\w* vlock\w*|ovsene vlocky|oat flakes|rolled oats)\b",
            "nut_butter":r"\b(arasidov\w* masl\w*|mandlov\w* masl\w*|peanut butter|almond butter|kesu masl\w*)\b",
          }
          groups=defaultdict(set);rows=Counter();cats=Counter()
          for o in data["products"]:
              if o.get("merchant")!="NaMaximum.cz" or not catalog_identity_matches_url(o.get("id"),o.get("source_url")): continue
              if delivery_state(o) not in {"feed_stocked","up_to_week","unknown"}: continue
              cats[o.get("category") or ""]+=1
              title=folded(o["title"])
              for k,p in patterns.items():
                  if re.search(p,title):
                      groups[k].add(urlsplit(o["source_url"]).path.rstrip("/"))
                      rows[k]+=1
          print(json.dumps({"state":"FIFTH_LANE_SCREEN","eligible_category_counts":cats.most_common(45),"groups":{k:{"rows":rows[k],"families":len(groups[k])} for k in patterns},"wordpress_writes":0,"merchant_clicks":0,"source_only":True},ensure_ascii=False))
          PY
      - name: Preserve redacted validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xfit-namaximum-feed-summary
          path: |
            reports/affiliate-feed-summary.json
            reports/xfit-multishop-source-readiness.json
          retention-days: 7
          if-no-files-found: error

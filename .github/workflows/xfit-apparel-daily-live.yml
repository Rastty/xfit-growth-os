name: XFIT Apparel Daily Live Refresh
on:
  schedule:
    - cron: '43 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xfit-apparel-daily-live.yml'
      - 'scripts/xfit_apparel_refresh.py'
      - 'scripts/xfit_apparel_comparison.py'
      - 'tests/apparel_comparison_mobile.cjs'
      - 'tests/test_apparel_comparison.py'
      - 'tests/test_apparel_refresh.py'
      - 'content/revisions/apparel-fit-buying-guide.html'
permissions:
  contents: read
  actions: read
concurrency:
  group: xfit-wp-heavy-reads
  cancel-in-progress: false
jobs:
  refresh:
    if: ${{ vars.XFIT_AFFIL_FEED_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL || 'https://xfit.cz' }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      XFIT_NAMAXIMUM_FEED_URL: ${{ secrets.XFIT_NAMAXIMUM_FEED_URL || secrets.XFIT_GREENMEDICAL_FEED_URL }}
      XFIT_AFFIL_DEFAULT_LINK: ${{ secrets.XFIT_AFFIL_DEFAULT_LINK }}
      XFIT_AFFIL_SAMPLE_PRODUCT_LINK: ${{ secrets.XFIT_AFFIL_SAMPLE_PRODUCT_LINK }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate existing release safeguards
        run: python -m unittest discover -s tests -v
      - name: Fetch fresh authenticated apparel catalog
        run: python scripts/xfit_feed_ingest.py
      - name: Validate campaign sample without clicks
        run: python scripts/xfit_affil_deeplink.py
      - name: Prepare exact new commercial block
        run: python -m scripts.xfit_apparel_comparison prepare
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify generated layout before any write
        run: node tests/apparel_comparison_mobile.cjs preview
      - name: Capture current pinned post and planned generated block
        run: python -m scripts.xfit_apparel_refresh snapshot
      - name: Immutable prewrite rollback backup
        uses: actions/upload-artifact@v4
        with:
          name: apparel-original-before-refresh
          path: reports/backups/xfit-apparel-before-refresh.json
          retention-days: 7
          if-no-files-found: error
      - name: Refresh only generated sections and verify live
        run: python -m scripts.xfit_apparel_refresh apply
      - name: Verify live card hrefs and mobile layout
        run: |
          node tests/apparel_comparison_mobile.cjs live
          node - <<'JS'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{const browser=await chromium.launch({headless:true});try{
            const page=await browser.newPage({viewport:{width:375,height:812}});
            await page.goto('https://xfit.cz/xfit-os-fitness-obleceni-nabidky/',{waitUntil:'domcontentloaded',timeout:45000});
            const guide=page.locator('#xfit-apparel-fit-guide-v1');
            assert.equal(await guide.count(),1);
            assert.ok(await guide.locator('h2').count()>=5);
            assert.ok((await guide.innerText()).split(/\s+/).length>=650);
            assert.equal(await guide.evaluate(el=>el.scrollWidth>el.clientWidth+2),false);
            console.log('APPAREL_EDITORIAL_MOBILE_LIVE_VERIFIED');
          }finally{await browser.close()}})().catch(()=>process.exitCode=2);
          JS
      - name: Read exact pending fabric article link inventory for next release
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from urllib.parse import urlsplit
          from scripts.xfit_legacy_fitness_fabric_guide import read
          from scripts.xfit_coupon_cleanup import stripped
          from scripts.wp_publish import editorial_links
          row=read()
          raw,n=stripped(row["content"]["raw"])
          counts=Counter()
          for href in editorial_links(raw):
              p=urlsplit(href)
              host=(p.hostname or "").removeprefix("www.")
              if host in {"xfit.cz","shape.com","cs.wikipedia.org","youtube.com","youtube-nocookie.com"}:
                  counts[(host,p.path)]+=1
              else:
                  counts[(host or "(relative)","[redacted]")]+=1
          print(json.dumps({"state":"FABRIC_SOURCE_LINK_INVENTORY","post_id":row["id"],"coupons":n,"links":[{"host":h,"path":p,"count":c} for (h,p),c in sorted(counts.items())],"wordpress_writes":0},ensure_ascii=False))
          PY
      - name: Preserve mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apparel-refresh-mobile
          path: reports/browser-qa/apparel-*.png
          retention-days: 7
          if-no-files-found: ignore

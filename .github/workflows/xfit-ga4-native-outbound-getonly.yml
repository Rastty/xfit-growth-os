name: XFIT Native GA4 Outbound Click Readiness GET Only
# One-time production proof of GA4 tag type and ordinary merchant <a> links.
# No WordPress POST, event dispatch, merchant GET, plugin installation or synthetic conversions.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xfit-ga4-native-outbound-getonly.yml'
permissions:
  contents: read
concurrency:
  group: xfit-ga4-native-outbound-getonly-20261121
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL || 'https://xfit.cz' }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test GA4 vs Ads/GTM classification and privacy boundary
        run: python -m unittest tests.test_ga4_native_outbound_readonly tests.test_analytics_cmp_preflight -v
      - name: GET only public creatine/whey CTA markup, Google tag types and installed plugin inventory
        shell: bash
        run: |
          set -o pipefail
          python -m scripts.xfit_ga4_native_outbound_readonly
      - name: Preserve redacted production readiness evidence without IDs or affiliate URLs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xfit-ga4-native-outbound-readonly-${{ github.run_id }}
          path: reports/xfit-ga4-native-outbound-readonly.json
          if-no-files-found: warn
          retention-days: 14

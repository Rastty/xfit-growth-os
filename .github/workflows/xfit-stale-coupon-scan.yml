name: XFIT Expired Coupon Scan
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/xfit-stale-coupon-scan.yml']
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    concurrency:
      group: xfit-wp-heavy-reads
      cancel-in-progress: false
    timeout-minutes: 15
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL || 'https://xfit.cz' }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Find active expired 2022 coupon shortcodes before cleanup
        run: python -m scripts.xfit_stale_coupon

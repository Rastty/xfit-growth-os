name: XFIT Eight-Guide Public Discovery Readonly
# Inspect exact public pages, internal inlinks and WordPress post sitemap only.
# No credentials, no WordPress writes, no synthetic Google indexing requests.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xfit-seven-guide-discovery-readonly.yml'
      - 'scripts/xfit_indexability_preflight.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xfit-seven-guide-readonly
  cancel-in-progress: false
jobs:
  public-discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source scope and XML/indexability regression
        run: |
          python -m unittest tests.test_indexability_preflight -v
          python -m compileall -q scripts/xfit_indexability_preflight.py
      - name: Read exact eight live guides, sitemap, and reviewed inlink graph
        shell: bash
        run: |
          set -o pipefail
          python -m scripts.xfit_indexability_preflight | tee "$GITHUB_STEP_SUMMARY"
      - name: Keep bounded redacted public discovery receipt
        uses: actions/upload-artifact@v4
        with:
          name: xfit-eight-guide-public-discovery-${{ github.run_id }}
          path: reports/xfit-indexability-readonly.json
          retention-days: 14
          if-no-files-found: error

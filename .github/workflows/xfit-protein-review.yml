name: XFIT Protein Legacy Content Review
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/xfit-protein-review.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL || 'https://xfit.cz' }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Review originals for helpfulness and overlap, no writes
        run: python -m scripts.xfit_protein_legacy_review

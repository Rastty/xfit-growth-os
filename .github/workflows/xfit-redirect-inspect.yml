name: XFIT Redirect API Inspect
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/xfit-redirect-inspect.yml', 'scripts/xfit_redirect_inspect.py']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL || 'https://xfit.cz' }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Determine whether Redirection REST API can be used, no writes
        run: python -m scripts.xfit_redirect_inspect

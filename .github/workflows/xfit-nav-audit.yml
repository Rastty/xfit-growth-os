name: XFIT Navigation Read-only Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/xfit-nav-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL || 'https://xfit.cz' }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit menu locations and stale navigation items, read only
        run: python -m scripts.xfit_nav_audit

name: XFIT Pilates After Surgery 5929 Editorial Safety Revision
# Exact post, source-drift guard, full rollback artifact, one POST, public readback.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xfit-pilates-after-surgery-5929-live.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Confirm exact WordPress post 5929 evidence-backed correction'
        type: choice
        required: true
        options: [REVISE_5929]
permissions:
  contents: read
concurrency:
  group: xfit-wp-heavy-reads
  cancel-in-progress: false
jobs:
  revise-one:
    if: github.event_name == 'push' || inputs.confirm == 'REVISE_5929'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL || 'https://xfit.cz' }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Full quality and exact-post safety regressions
        run: python -m unittest discover -s tests -q
      - name: Snapshot original unsafe article as complete WordPress raw HTML
        run: python -m scripts.xfit_pilates_after_surgery_5929 snapshot
      - name: Mandatory immutable 90-day rollback backup BEFORE content write
        uses: actions/upload-artifact@v4
        with:
          name: xfit-pilates-after-surgery-5929-original-${{ github.run_id }}
          path: reports/backups/xfit-pilates-after-surgery-5929-original.json
          retention-days: 90
          if-no-files-found: error
      - name: Content-only one-post release with authenticated and public verification
        shell: bash
        run: |
          set -o pipefail
          python -m scripts.xfit_pilates_after_surgery_5929 deploy | tee -a "$GITHUB_STEP_SUMMARY"

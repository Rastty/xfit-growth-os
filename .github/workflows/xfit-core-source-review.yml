name: XFIT Core Legacy Source Review
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xfit-core-source-review.yml'
permissions:
  contents: read
concurrency:
  group: xfit-wp-heavy-reads
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL || 'https://xfit.cz' }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Review exact published core source (GET only)
        run: |
          python - <<'PY'
          import json,re
          from collections import Counter
          from urllib.parse import urlsplit, urljoin, parse_qs
          from scripts.wp_publish import wp_request,normalized_base,PublishError,normalize_visible
          from urllib.parse import urlencode
          SLUG="5-nejlepsich-cviku-na-zpevneni-bricha"
          URL="https://xfit.cz/"+SLUG+"/"
          TITLE="5 nejlepších cviků na zpevnění břicha"
          def read():
              rows=wp_request(normalized_base(),"posts?"+urlencode({"slug":SLUG,"context":"edit","status":"publish","per_page":2,"_fields":"id,slug,status,link,title,content"}))
              if len(rows)!=1 or rows[0]["link"]!=URL or normalize_visible(rows[0]["title"]["raw"])!=normalize_visible(TITLE):
                  raise PublishError("Source identity mismatch")
              return rows[0]
          from scripts.wp_publish import editorial_links
          from scripts.xfit_coupon_cleanup import stripped
          row=read()
          raw=row["content"]["raw"]
          clean,n=stripped(raw)
          safe=lambda u: {"host":urlsplit(urljoin(URL,u)).hostname,"path":urlsplit(urljoin(URL,u)).path[:240]}
          links=[safe(u) for u in editorial_links(clean) if u not in ("","#")]
          placeholders=Counter(u for u in editorial_links(clean) if u in ("","#"))
          shortcodes=Counter(re.findall(r"\[/?([A-Za-z][A-Za-z0-9_-]*)\b",clean))
          tags=Counter(re.findall(r"<\s*(iframe|video|audio|script|form|object|embed)\b",clean,re.I))
          frames=[safe(u) for u in re.findall(r'<iframe\b[^>]*\bsrc\s*=\s*["\x27]([^"\x27]+)["\x27]',clean,re.I)]
          from scripts.xfit_legacy_fitness_fabric_guide import Images
          def image_info(source):
              parser=Images();parser.feed(source)
              result=[]
              for img in parser.images:
                  fields={}
                  for k in ("src","data-src","data-lazy-src","srcset","data-srcset","data-lazy-srcset"):
                      if not img.get(k):continue
                      u=img[k]
                      if u.startswith("data:"):
                          fields[k]={"scheme":"data","type":u[5:].split(";",1)[0].split(",",1)[0],"chars":len(u)}
                      else:
                          fields[k]=[safe(v.strip().split()[0]) for v in u.split(",") if v.strip()] if "srcset" in k else safe(u)
                  result.append(fields)
              return result
          print(json.dumps({"state":"CORE_IMAGE_REVIEW","raw":image_info(raw),"rendered":image_info(row["content"]["rendered"]),"wordpress_writes":0},ensure_ascii=False))
          print(json.dumps({"state":"CORE_SOURCE_REVIEW","id":row["id"],"known_coupon_count":n,"residual_old_coupon": "5nm2022" in clean.casefold(),"shortcodes":dict(shortcodes),"embedded_tags":dict(tags),"frames":frames,"link_destinations":links,"placeholder_counts":dict(placeholders),"wordpress_writes":0},ensure_ascii=False))
          PY

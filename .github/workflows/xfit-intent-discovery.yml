name: XFIT High Intent Internal Link Discovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/xfit-intent-discovery.yml']
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL || 'https://xfit.cz' }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Identify relevant existing pages without publishing
        run: python -m scripts.xfit_intent_discovery

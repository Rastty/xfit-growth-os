name: XFIT Legacy Canonical 8713 Source-Guarded Onepost
# One exact original WordPress post, immutable backup before at most one POST.
# No new posts, redirects, deletions or automatic retries.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xfit-legacy-canonical-8713-onepost.yml'
permissions:
  contents: read
concurrency:
  group: xfit-wp-heavy-reads
  cancel-in-progress: false
jobs:
  source-guarded-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL || 'https://xfit.cz' }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and run complete Python regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -q
      - name: Authenticated and public GET; archive entire original article
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.xfit_canonical_8713_onepost snapshot
      - name: Upload full original authenticated source BEFORE WP POST
        uses: actions/upload-artifact@v4
        with:
          name: xfit-canonical-8713-original-${{ github.run_id }}
          path: reports/backups/xfit-canonical-8713-full-original.json
          retention-days: 90
          if-no-files-found: error
      - name: Remove one wrong body canonical, exactly one WP POST, readback
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.xfit_canonical_8713_onepost deploy | tee -a "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          data=json.loads(Path("reports/backups/xfit-canonical-8713-full-original.json").read_text())
          print("XFIT_CANONICAL_8713_URL="+data["source"]["link"])
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test-only Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify original page on Chrome 320, 375 and 768 px
        run: node tests/canonical_8713_live_mobile.cjs
      - name: Preserve mobile screenshots if available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xfit-canonical-8713-mobile-${{ github.run_id }}
          path: reports/browser-qa/canonical-8713-*.png
          retention-days: 7
          if-no-files-found: ignore

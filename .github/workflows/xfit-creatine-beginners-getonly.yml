name: XFIT Beginner Creatine WP Source Receipt GET Only
# One existing GSC-visible legacy article; no WordPress mutations.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xfit-creatine-beginners-getonly.yml'
permissions:
  contents: read
concurrency:
  group: xfit-creatine-beginners-getonly-20261121
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL || 'https://xfit.cz' }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate reviewed content and no-write safety tests
        run: python -m unittest tests.test_creatine_beginners_onepost -v
      - name: Record redacted source SHA and identity with one authenticated GET
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          python -m scripts.xfit_creatine_beginners_onepost diagnose | tee reports/xfit-creatine-beginners-source.json
      - name: Preserve read-only source identity evidence for exact-source subsequent release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xfit-creatine-beginners-source-${{ github.run_id }}
          path: reports/xfit-creatine-beginners-source.json
          if-no-files-found: warn
          retention-days: 30

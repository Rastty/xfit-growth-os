name: XFIT Legacy Gymwear Reader Fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xfit-legacy-gymwear-reader-fix.yml'
permissions:
  contents: read
  issues: write
concurrency:
  group: xfit-wp-heavy-reads
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL || 'https://xfit.cz' }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      XFIT_GITHUB_ISSUES_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate repository
        run: python -m unittest discover -s tests -v
      - name: Capture reviewed exact existing article and destination
        run: python -m scripts.xfit_legacy_gymwear_reader_fix snapshot
      - name: Upload immutable original
        uses: actions/upload-artifact@v4
        with:
          name: legacy-gymwear-original
          path: reports/backups/xfit-legacy-gymwear-original.json
          retention-days: 90
          if-no-files-found: error
      - name: Reserve old coupon ID if needed and perform one source-bound write
        run: python -m scripts.xfit_legacy_gymwear_reader_fix apply
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify live mobile article and internal route
        run: |
          node - <<'JS'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{const browser=await chromium.launch({headless:true});try{
            const page=await browser.newPage({viewport:{width:375,height:812}});
            await page.goto('https://xfit.cz/damske-obleceni-do-posilovny-inspirace-pro-ruzne-typy-tel/',{waitUntil:'domcontentloaded',timeout:45000});
            const guide=page.locator('#xfit-gymwear-practical-20261128');
            assert.equal(await guide.count(),1);
            const target=guide.locator('a[href="https://xfit.cz/xfit-os-fitness-obleceni-nabidky/"]');
            assert.equal(await target.count(),1);
            assert.ok(await target.isVisible());
            assert.equal(await guide.evaluate(el=>el.scrollWidth>el.clientWidth+2),false);
            assert.equal(await page.locator('a[href*="example.com"]').count(),0);
            console.log('LEGACY_GYMWEAR_MOBILE_LIVE_VERIFIED');
          }finally{await browser.close()}})().catch(()=>process.exitCode=2);
          JS

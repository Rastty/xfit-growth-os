name: XFIT First Guide Slug Repair
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xfit-reconcile-first-guide.yml'
permissions:
  contents: read
concurrency:
  group: xfit-direct-publish
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair only two owned Xfit posts and verify public permalink
        run: |
          if [[ -z "${WP_BASE_URL:-}" ]]; then export WP_BASE_URL="https://xfit.cz"; fi
          python -m unittest discover -s tests -v
          python -m scripts.wp_reconcile_first_guide

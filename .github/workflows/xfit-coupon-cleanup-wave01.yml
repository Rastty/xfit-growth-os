name: XFIT Expired Coupon Cleanup
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/xfit-coupon-cleanup-wave01.yml']
  schedule:
    # TURBO 2026-11-27: 8 bounded, serialized waves/day after publicly verified
    # 8/8 posts and 24 shortcode removals in run 46015361054. Each wave still
    # changes at most eight NEVER-attempted posts, reserves IDs in issue #363,
    # uploads the immutable rollback BEFORE POST, and verifies public readback.
    # Do not increase MAX_COUNT=8 or retry ambiguous/failed posts.
    - cron: '17 2,5,8,11,14,17,20,23 * * *'
permissions:
  contents: read
  issues: write   # Dedicated issue #363: reserve post IDs, never raw WP content
concurrency:
  group: xfit-wp-heavy-reads
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL || 'https://xfit.cz' }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      XFIT_GITHUB_ISSUES_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repository tests
        run: python -m unittest discover -s tests -v
      - name: Read-only paginated preview of up to eight never-attempted coupon posts
        run: python -m scripts.xfit_coupon_cleanup snapshot
      - name: Backup artifact is mandatory before any WordPress writes
        uses: actions/upload-artifact@v4
        with:
          name: xfit-expired-coupon-rollback-${{ github.run_id }}
          path: reports/backups/xfit-expired-coupon-wave01.json
          retention-days: 90
          if-no-files-found: error
      - name: Reserve all post IDs in issue 363 BEFORE any WP POST; then verify public pages
        shell: bash
        run: |
          set -o pipefail
          python -m scripts.xfit_coupon_cleanup apply | tee -a "$GITHUB_STEP_SUMMARY"

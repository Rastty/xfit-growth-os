name: XFIT Affiliate Link Health
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xfit-affiliate-health.yml'
      - 'scripts/xfit_affiliate_health.py'
      - 'scripts/xfit_affiliate_public_audit.py'
      - 'scripts/xfit_merchant_destination_probe.py'
      - 'tests/test_affiliate_public_audit.py'
      - 'tests/test_merchant_destination_probe.py'
      - 'scripts/xfit_public_feed_parity.py'
      - 'tests/test_public_feed_parity.py'
      - 'tests/test_expanded_offer_parity.py'
  schedule:
    - cron: '43 6 * * *'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      XFIT_AFFIL_DEFAULT_LINK: ${{ secrets.XFIT_AFFIL_DEFAULT_LINK }}
      XFIT_AFFIL_SAMPLE_PRODUCT_LINK: ${{ secrets.XFIT_AFFIL_SAMPLE_PRODUCT_LINK }}
      XFIT_NAMAXIMUM_FEED_URL: ${{ secrets.XFIT_NAMAXIMUM_FEED_URL || secrets.XFIT_GREENMEDICAL_FEED_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify live merchant destinations and affiliate disclosure
        run: python -m scripts.xfit_affiliate_health
      - name: Verify actual public product CTA tracking matches WordPress source
        run: python -m scripts.xfit_affiliate_public_audit
      - name: Inspect untracked product destinations (diagnostic only)
        run: python -m scripts.xfit_merchant_destination_probe
      - name: Compare live advertised cards against latest private XML (read-only)
        if: ${{ vars.XFIT_AFFIL_FEED_ENABLED == 'true' }}
        run: python -m scripts.xfit_public_feed_parity
      - name: Keep redacted public offer/feed parity evidence, no raw catalog
        if: ${{ vars.XFIT_AFFIL_FEED_ENABLED == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: xfit-current-offer-feed-parity-${{ github.run_id }}
          path: reports/xfit-feed-public-offer-parity.json
          retention-days: 14
          if-no-files-found: error

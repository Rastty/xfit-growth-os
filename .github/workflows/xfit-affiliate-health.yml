name: XFIT Affiliate Link Health
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xfit-affiliate-health.yml'
      - 'scripts/xfit_affiliate_health.py'
  schedule:
    - cron: '43 6 * * *'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      XFIT_AFFIL_DEFAULT_LINK: ${{ secrets.XFIT_AFFIL_DEFAULT_LINK }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify live merchant destinations and affiliate disclosure
        run: python -m scripts.xfit_affiliate_health

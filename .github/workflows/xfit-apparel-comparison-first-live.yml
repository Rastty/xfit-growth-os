name: XFIT Apparel Comparison First Live Release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xfit-apparel-comparison-first-live.yml'
      - 'scripts/xfit_apparel_comparison.py'
      - 'tests/test_apparel_comparison.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xfit-wp-heavy-reads
  cancel-in-progress: false
jobs:
  release:
    if: ${{ vars.XFIT_AFFIL_FEED_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL || 'https://xfit.cz' }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      XFIT_NAMAXIMUM_FEED_URL: ${{ secrets.XFIT_NAMAXIMUM_FEED_URL || secrets.XFIT_GREENMEDICAL_FEED_URL }}
      XFIT_AFFIL_DEFAULT_LINK: ${{ secrets.XFIT_AFFIL_DEFAULT_LINK }}
      XFIT_AFFIL_SAMPLE_PRODUCT_LINK: ${{ secrets.XFIT_AFFIL_SAMPLE_PRODUCT_LINK }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate full repository before new-only release
        run: python -m unittest discover -s tests -v
      - name: Fetch fresh authenticated feed into runner
        run: python scripts/xfit_feed_ingest.py
      - name: Verify campaign sample without clicks
        run: python scripts/xfit_affil_deeplink.py
      - name: Validate real apparel catalog and prepare exact new document
        run: python -m scripts.xfit_apparel_comparison prepare
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify prepared mobile layout before any write
        run: node tests/apparel_comparison_mobile.cjs preview
      - name: Publish new owned slug only and prove public content
        run: python -m scripts.xfit_apparel_comparison apply
      - name: Verify exact live CTA destinations and mobile layout
        run: node tests/apparel_comparison_mobile.cjs live
      - name: Preserve browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apparel-comparison-mobile
          path: reports/browser-qa/apparel-*.png
          retention-days: 7
          if-no-files-found: ignore

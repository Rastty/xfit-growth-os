name: XFIT Four-hour Status
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xfit-status.yml'
      - 'scripts/xfit_status.py'
      - 'scripts/xfit_status_evidence.py'
      - 'tests/test_status_evidence.py'
      - 'tests/test_status_lanes.py'
  schedule:
    - cron: '13 */4 * * *'
permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: write
concurrency:
  group: xfit-status-comment
  cancel-in-progress: false
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate production receipt classification before issue write
        run: python -m unittest tests.test_status_evidence tests.test_status_lanes -v
      - name: Collect evidence and post status to issue #1
        run: python -m scripts.xfit_status

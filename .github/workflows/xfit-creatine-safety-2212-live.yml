name: XFIT Legacy Creatine Safety 2212 Evidence Rescue
# One exact published high-risk medical-information page. No mass writes, no create.
# Rollback source uploaded as artifact BEFORE the only possible WordPress POST.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xfit-creatine-safety-2212-live.yml'
permissions:
  contents: read
concurrency:
  group: xfit-wp-heavy-reads
  cancel-in-progress: false
jobs:
  revise-exact-one:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL || 'https://xfit.cz' }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and run complete safety regression before WP changes
        run: |
          set -euo pipefail
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -q
      - name: Source-bound editorial audit and exact WP 2212 prewrite snapshot
        run: python -m scripts.xfit_creatine_safety_2212_revision snapshot
      - name: Upload entire original WordPress article and metadata BEFORE write
        uses: actions/upload-artifact@v4
        with:
          name: xfit-creatine-safety-2212-original-${{ github.run_id }}
          path: reports/backups/xfit-creatine-safety-2212-original.json
          retention-days: 90
          if-no-files-found: error
      - name: One content-only WP POST then authenticated and public verification
        shell: bash
        run: |
          set -o pipefail
          python -m scripts.xfit_creatine_safety_2212_revision deploy | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test-only Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Real mobile 320/375/768 px public editorial QA
        run: node tests/creatine_safety_2212_live_mobile.cjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xfit-creatine-safety-2212-mobile-${{ github.run_id }}
          path: reports/browser-qa/creatine-safety-2212-*.png
          retention-days: 7
          if-no-files-found: ignore

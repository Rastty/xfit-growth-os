name: XFIT Codex Parallel Development
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xfit-codex-parallel.yml'
  schedule:
    # Two independent four-agent waves daily; can increase after costs and quality are measured.
    - cron: '39 0,12 * * *'
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: xfit-codex-wave
  cancel-in-progress: false
jobs:
  permission-gate:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      can_create_pr: ${{ steps.check.outputs.can_create_pr }}
    steps:
      - name: Check GitHub Actions PR permission BEFORE spending OpenAI tokens
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          allowed="$(gh api "repos/$GITHUB_REPOSITORY/actions/permissions/workflow" \
            --jq '.can_approve_pull_request_reviews' 2>/dev/null || echo unavailable)"
          if [[ "$allowed" == "true" ]]; then
            echo "can_create_pr=true" >> "$GITHUB_OUTPUT"
            echo "PR creation enabled; Codex agent wave is permitted to run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "can_create_pr=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Actions cannot create PRs (or permission check unavailable). Skipping paid model calls."
            echo "No model calls. Enable 'Allow GitHub Actions to create and approve pull requests' under repository Settings -> Actions -> General, then run the workflow again." >> "$GITHUB_STEP_SUMMARY"
          fi
  parallel-lanes:
    needs: permission-gate
    if: ${{ vars.XFIT_CODEX_AGENTS_ENABLED == 'true' && needs.permission-gate.outputs.can_create_pr == 'true' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - lane: ux
            issue: 2
          - lane: archive
            issue: 3
          - lane: editor
            issue: 4
          - lane: revenue
            issue: 5
    uses: ./.github/workflows/xfit-codex-lane.yml
    with:
      lane: ${{ matrix.lane }}
      issue: ${{ matrix.issue }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

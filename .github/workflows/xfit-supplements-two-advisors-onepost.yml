name: XFIT Two Product Advisers Supplement Category Onepost
# One approved pair of existing WP posts; no new content, offers or redirects.
# Full prewrite rollback uploaded before any category-only POST.
# 44897339584 failed before POST marker; GET-only 44897698415 confirmed both unassigned.
# This release pins both observed original source hashes; no blind retry after a POST.
# Fresh zero-write auth/source + public audit: run 45002544614, 2026-11-22 08:24 UTC.
# Category term 44: guide WP 25458 rank #1; both advisers are published but
# absent from category. Each still has original approved 2026-11-21 raw SHA:
# WP 25455 c4bbe1182700516918b5797656af493bda0580e046a336982f2482be24e0b1dd
# WP 25456 7dc434d2ddc1a63e31dce1afd0fea0f04204e0d17ff7f03532b5c2e9bafc33e8
# Both are already native homepage sticky, categories [1]. DO NOT change sticky.
# Owner-scoped continuation after confirmed prior prewrite failures: one attempt
# PER article, mandatory source backup before posts, no timeout/POST retry.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xfit-supplements-two-advisors-onepost.yml'
permissions:
  contents: read
concurrency:
  group: xfit-two-supplement-advisors-category-20261121
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL || 'https://xfit.cz' }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source, privacy, reader journey, and single-attempt regression tests
        run: |
          set -euo pipefail
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -q
      - name: Pin exact two original WP posts, supplement category and live archive
        run: python -m scripts.xfit_supplements_two_advisors_category snapshot
      - name: Preserve full source and categories for BOTH posts before any POST
        uses: actions/upload-artifact@v4
        with:
          name: xfit-two-supplement-advisors-original-${{ github.run_id }}
          path: reports/backups/xfit-supplements-two-advisors-20261121.json
          retention-days: 90
          if-no-files-found: error
      - name: Add category once to each post, prove exact original source and public top-three
        run: python -m scripts.xfit_supplements_two_advisors_category apply
